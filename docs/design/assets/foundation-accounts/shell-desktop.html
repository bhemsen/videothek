<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P1 Shell desktop B</title>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #e8eaed;
      --primary: #f5b301;
      --surface: #1c2029;
      --accent: #4fb3ff;
      --muted: #9aa0aa;
      --border: #2a2f3a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    header {
      height: 64px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 50;
      width: 100%;
    }

    .header-inner {
      width: 100%;
      max-width: 1280px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      position: relative;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 40px;
      height: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      color: var(--fg);
      text-decoration: none;
      user-select: none;
    }

    .brand svg {
      width: 24px;
      height: 24px;
      fill: var(--primary);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 32px;
      height: 100%;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      height: 100%;
      position: relative;
      transition: color 0.15s ease;
      cursor: pointer;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-item:hover {
      color: var(--fg);
    }

    .nav-item.active {
      color: var(--primary);
      font-weight: 600;
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--primary);
    }

    /* Account button & Dropdown container */
    .account-wrapper {
      position: relative;
    }

    .account-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: 1px solid transparent;
      padding: 6px 10px 6px 6px;
      border-radius: 9999px;
      color: var(--fg);
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
    }

    .account-avatar {
      width: 32px;
      height: 32px;
      background-color: var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--fg);
    }

    .account-name {
      color: var(--fg);
    }

    .chevron-icon {
      width: 16px;
      height: 16px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Dropdown open */
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 240px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 100;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .dropdown-header {
      padding: 12px 16px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .dropdown-divider {
      height: 1px;
      background-color: var(--border);
      width: 100%;
    }

    .dropdown-item {
      height: 44px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--fg);
      text-decoration: none;
      font-size: 14px;
      transition: background-color 0.15s ease;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background-color: rgba(255, 255, 255, 0.04);
    }

    .dropdown-item svg {
      width: 18px;
      height: 18px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* Content Area */
    main {
      flex: 1;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px;
      display: flex;
      flex-direction: column;
    }

    .page-title {
      font-size: 32px;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 48px;
    }

    .empty-state-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 64px;
    }

    .empty-state-card {
      width: 100%;
      max-width: 560px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      stroke: var(--muted);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-bottom: 24px;
    }

    .empty-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 12px;
    }

    .empty-description {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.5;
      max-width: 420px;
    }
  </style>
</head>
<body>

  <!-- 1) Header -->
  <header>
    <div class="header-inner">
      <div class="header-left">
        <!-- Brand -->
        <a href="#" class="brand">
          <svg viewBox="0 0 24 24">
            <path d="M6 4l15 8-15 8V4z" />
          </svg>
          Videothek
        </a>

        <!-- Horizontal Nav with Icon + Label -->
        <nav>
          <!-- Filme (Active) -->
          <a class="nav-item active">
            <svg viewBox="0 0 24 24">
              <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
              <line x1="7" y1="2" x2="7" y2="22"></line>
              <line x1="17" y1="2" x2="17" y2="22"></line>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <line x1="2" y1="7" x2="7" y2="7"></line>
              <line x1="2" y1="17" x2="7" y2="17"></line>
              <line x1="17" y1="17" x2="22" y2="17"></line>
              <line x1="17" y1="7" x2="22" y2="7"></line>
            </svg>
            <span>Filme</span>
          </a>

          <!-- Serien -->
          <a class="nav-item">
            <svg viewBox="0 0 24 24">
              <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
              <polyline points="17 2 12 7 7 2"></polyline>
            </svg>
            <span>Serien</span>
          </a>

          <!-- Musik -->
          <a class="nav-item">
            <svg viewBox="0 0 24 24">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
            <span>Musik</span>
          </a>

          <!-- Hörbücher -->
          <a class="nav-item">
            <svg viewBox="0 0 24 24">
              <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
              <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
            </svg>
            <span>Hörbücher</span>
          </a>

          <!-- Bilder -->
          <a class="nav-item">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span>Bilder</span>
          </a>
        </nav>
      </div>

      <!-- Account Button + Open Dropdown -->
      <div class="account-wrapper">
        <button class="account-btn" type="button" aria-haspopup="true" aria-expanded="true">
          <div class="account-avatar">A</div>
          <span class="account-name">anna</span>
          <svg class="chevron-icon" viewBox="0 0 24 24">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>

        <!-- 2) Open Account Dropdown -->
        <div class="dropdown-menu" role="menu">
          <div class="dropdown-header">
            Angemeldet als anna (Admin)
          </div>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" role="menuitem">
            <svg viewBox="0 0 24 24">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Benutzerverwaltung</span>
          </a>
          <a class="dropdown-item" role="menuitem">
            <svg viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Abmelden</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- 3) Content -->
  <main>
    <h1 class="page-title">Filme</h1>
    <div class="empty-state-wrapper">
      <div class="empty-state-card">
        <!-- 64px muted film-strip line icon -->
        <svg class="empty-icon" viewBox="0 0 24 24">
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
          <line x1="7" y1="2" x2="7" y2="22"></line>
          <line x1="17" y1="2" x2="17" y2="22"></line>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <line x1="2" y1="7" x2="7" y2="7"></line>
          <line x1="2" y1="17" x2="7" y2="17"></line>
          <line x1="17" y1="17" x2="22" y2="17"></line>
          <line x1="17" y1="7" x2="22" y2="7"></line>
        </svg>
        <h2 class="empty-title">Noch nicht verfügbar</h2>
        <p class="empty-description">Diese Kategorie wird in einer späteren Version freigeschaltet.</p>
      </div>
    </div>
  </main>

</body>
</html>
