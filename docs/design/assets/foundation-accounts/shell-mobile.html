<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>P1 Shell – mobile</title>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #e8eaed;
      --primary: #f5b301;
      --surface: #1c2029;
      --accent: #4fb3ff;
      --muted: #9aa0aa;
      --border: #2a2f3a;
      --radius-md: 8px;
      --radius-lg: 16px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* Container for mobile frame feeling if rendered wide, but fully responsive 360-390px */
    .mobile-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background-color: var(--bg);
      position: relative;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    }

    /* 1) Top bar */
    .top-bar {
      height: 56px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--fg);
    }

    .brand-icon-box {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.02em;
    }

    .account-button {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px;
      min-height: 44px;
      min-width: 44px;
      justify-content: center;
      border-radius: var(--radius-md);
    }

    .account-button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .avatar-circle {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background-color: var(--border);
      color: var(--fg);
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .chevron-icon {
      color: var(--muted);
      display: flex;
      align-items: center;
    }

    /* 2) Main Content */
    .main-content {
      flex: 1;
      padding: 24px 16px 88px 16px; /* 88px bottom padding to clear 64px bar + spacing */
      display: flex;
      flex-direction: column;
    }

    .page-heading {
      font-size: 24px;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 24px;
      line-height: 1.2;
    }

    .empty-state-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto 0;
    }

    .empty-state-icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-full);
      background-color: rgba(42, 47, 58, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .empty-state-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .empty-state-text {
      font-size: 14px;
      color: var(--muted);
      max-width: 280px;
      line-height: 1.5;
    }

    /* 3) Fixed Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      height: 64px;
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      justify-content: space-around;
      z-index: 30;
      padding: 0 4px;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      padding: 6px 0;
      text-decoration: none;
      color: var(--muted);
      gap: 4px;
      user-select: none;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: var(--radius-md);
      transition: color 0.15s ease;
    }

    .nav-item:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: -2px;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-label {
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>

  <div class="mobile-shell">
    <!-- Top Bar -->
    <header class="top-bar">
      <a href="#" class="brand" aria-label="Videothek Startseite">
        <div class="brand-icon-box" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 5.5V18.5L18 12L7 5.5Z" fill="#f5b301" stroke="#f5b301" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="brand-title">Videothek</span>
      </a>

      <button class="account-button" aria-label="Benutzerkonto öffnen">
        <div class="avatar-circle">A</div>
        <div class="chevron-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </button>
    </header>

    <!-- Content Area -->
    <main class="main-content">
      <h1 class="page-heading">Filme</h1>

      <div class="empty-state-card">
        <div class="empty-state-icon-wrap" aria-hidden="true">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#9aa0aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2.5" ry="2.5"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <line x1="2" y1="7" x2="7" y2="7"></line>
            <line x1="2" y1="17" x2="7" y2="17"></line>
            <line x1="17" y1="17" x2="22" y2="17"></line>
            <line x1="17" y1="7" x2="22" y2="7"></line>
          </svg>
        </div>
        <h2 class="empty-state-title">Noch nicht verfügbar</h2>
        <p class="empty-state-text">Diese Kategorie wird in einer späteren Version freigeschaltet.</p>
      </div>
    </main>

    <!-- Fixed Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <!-- 1. Filme (Aktiv) -->
      <button class="nav-item active" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="2.5" ry="2.5"></rect>
          <line x1="7" y1="2" x2="7" y2="22"></line>
          <line x1="17" y1="2" x2="17" y2="22"></line>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <line x1="2" y1="7" x2="7" y2="7"></line>
          <line x1="2" y1="17" x2="7" y2="17"></line>
          <line x1="17" y1="17" x2="22" y2="17"></line>
          <line x1="17" y1="7" x2="22" y2="7"></line>
        </svg>
        <span class="nav-label">Filme</span>
      </button>

      <!-- 2. Serien -->
      <button class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
          <polyline points="17 2 12 7 7 2"></polyline>
        </svg>
        <span class="nav-label">Serien</span>
      </button>

      <!-- 3. Musik -->
      <button class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span class="nav-label">Musik</span>
      </button>

      <!-- 4. Hörbücher -->
      <button class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
          <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
        </svg>
        <span class="nav-label">Hörbücher</span>
      </button>

      <!-- 5. Bilder -->
      <button class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span class="nav-label">Bilder</span>
      </button>
    </nav>
  </div>

</body>
</html>
