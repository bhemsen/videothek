<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>P1 Admin users – desktop</title>
<style>:root {
    --bg: #0f1115;
    --fg: #e8eaed;
    --primary: #ff7a1a;
    --surface: #1c2029;
    --accent: #4fb3ff;
    --muted: #9aa0aa;
    --border: #2a2f3a;
    --destructive: #ff5c5c;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif
    }
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0
    }
body {
    background-color: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5
    }
/* Header */
header {
    height: 64px;
    background-color: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 10
    }
.header-inner {
    width: 100%;
    max-width: 1280px;
    display: flex;
    align-items: center;
    justify-content: space-between
    }
.header-left {
    display: flex;
    align-items: center;
    gap: 36px
    }
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--fg);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.2px
    }
.nav-links {
    display: flex;
    align-items: center;
    gap: 24px;
    list-style: none
    }
.nav-item a {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    padding: 8px 12px;
    border-radius: 8px;
    min-height: 44px;
    transition: color 0.15s ease
    }
.nav-item a:hover {
    color: var(--fg)
    }
.header-right {
    display: flex;
    align-items: center
    }
.account-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px 6px 8px;
    color: var(--fg);
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    min-height: 44px
    }
.avatar-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--border);
    color: var(--fg);
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center
    }
/* Main Content */
main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 32px
    }
.content-inner {
    width: 100%;
    max-width: 1280px;
    display: flex;
    flex-direction: column;
    gap: 28px
    }
/* Page Heading */
.page-header {
    display: flex;
    flex-direction: column;
    gap: 4px
    }
.page-title {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: var(--fg)
    }
.page-subline {
    font-size: 15px;
    color: var(--muted)
    }
/* Two Columns Layout */
.grid-container {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 32px;
    align-items: start
    }
/* Card Panels */
.card {
    background-color: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px
    }
/* Table Component */
.table-container {
    overflow: hidden
    }
table {
    width: 100%;
    border-collapse: collapse;
    text-align: left
    }
thead th {
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background-color: rgba(255, 255, 255, 0.015)
    }
tbody tr {
    border-bottom: 1px solid var(--border);
    height: 56px
    }
tbody tr:last-child {
    border-bottom: none
    }
tbody td {
    padding: 12px 24px;
    font-size: 15px;
    vertical-align: middle
    }
.user-name {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    color: var(--fg)
    }
.du-badge {
    color: var(--muted);
    font-weight: 400;
    font-size: 14px
    }
.table-select {
    background-color: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 32px 0 12px;
    height: 44px;
    font-family: inherit;
    font-size: 14px;
    appearance: none;
    -webkit-appearance: none;
    background-image: url(https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg);
    background-repeat: no-repeat;
    background-position: right 10px center;
    cursor: pointer
    }
.table-select:disabled {
    opacity: 0.4;
    cursor: not-allowed
    }
.date-cell {
    color: var(--muted);
    font-size: 14px;
    white-space: nowrap
    }
.actions-cell {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: flex-start;
    min-height: 56px
    }
/* Buttons */
.btn-secondary {
    background-color: var(--surface);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 0 16px;
    height: 44px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    transition: background-color 0.15s, border-color 0.15s
    }
.btn-secondary:hover {
    background-color: #232833;
    border-color: #3b4252
    }
.btn-danger {
    background-color: var(--surface);
    border: 1px solid var(--border);
    color: var(--destructive);
    border-radius: 8px;
    padding: 0 16px;
    height: 44px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    transition: background-color 0.15s, border-color 0.15s
    }
.btn-danger:hover:not(:disabled) {
    background-color: rgba(255, 92, 92, 0.08);
    border-color: var(--destructive)
    }
.btn-danger:disabled {
    opacity: 0.4;
    cursor: not-allowed
    }
/* Form Right Column */
.form-panel {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px
    }
.form-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--fg);
    letter-spacing: -0.3px
    }
.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px
    }
.form-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--fg)
    }
.form-input, .form-select {
    background-color: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--fg);
    font-family: inherit;
    font-size: 15px;
    height: 44px;
    padding: 0 14px;
    outline: none;
    transition: border-color 0.15s;
    width: 100%
    }
.form-input:focus, .form-select:focus {
    border-color: var(--primary)
    }
.form-select {
    appearance: none;
    -webkit-appearance: none;
    background-image: url(https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg);
    background-repeat: no-repeat;
    background-position: right 14px center;
    cursor: pointer
    }
.form-hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px
    }
.btn-primary {
    background-color: var(--primary);
    color: #0f1115;
    border: none;
    border-radius: 8px;
    height: 48px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    margin-top: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s, filter 0.15s
    }
.btn-primary:hover {
    filter: brightness(1.08)
    }
.btn-primary:active {
    filter: brightness(0.95)
    }
.btn-primary:focus-visible, .btn-secondary:focus-visible, .btn-danger:focus-visible, .account-btn:focus-visible, .table-select:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px
    }</style>
</head>
