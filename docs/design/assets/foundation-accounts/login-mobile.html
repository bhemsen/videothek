<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P1 Login – mobile</title>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #e8eaed;
      --primary: #f5b301;
      --surface: #1c2029;
      --accent: #4fb3ff;
      --muted: #9aa0aa;
      --border: #2a2f3a;
      --destructive: #ff5c5c;
      --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
    }

    /* Wordmark Header */
    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(245, 179, 1, 0.12);
    }

    .brand-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.02em;
    }

    /* Card */
    .card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .card-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }

    /* Form Fields */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .label {
      font-size: 14px;
      font-weight: 500;
      color: var(--fg);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field {
      width: 100%;
      height: 46px;
      background-color: #151820;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 14px;
      font-size: 16px;
      color: var(--fg);
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(245, 179, 1, 0.25);
    }

    .input-field.error {
      border-color: var(--destructive);
    }

    .input-field.error:focus {
      border-color: var(--destructive);
      box-shadow: 0 0 0 2px rgba(255, 92, 92, 0.25);
    }

    .error-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      color: var(--destructive);
      font-size: 13px;
      line-height: 1.4;
    }

    .error-icon {
      flex-shrink: 0;
    }

    /* Button */
    .btn-submit {
      width: 100%;
      height: 48px;
      min-height: 44px;
      background-color: var(--primary);
      color: #0f1115;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      transition: opacity 0.15s ease, filter 0.15s ease;
    }

    .btn-submit:hover {
      filter: brightness(1.06);
    }

    .btn-submit:active {
      filter: brightness(0.94);
    }

    .btn-submit:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* Footer Note */
    .footer-note {
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      padding: 0 8px;
    }
  </style>
</head>
<body>
  <main class="container">
    <!-- Brand / Wordmark -->
    <header class="brand-header">
      <div class="brand-logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M7 4.5V19.5L19 12L7 4.5Z" fill="#f5b301" />
        </svg>
      </div>
      <h1 class="brand-name">Videothek</h1>
    </header>

    <!-- Login Card -->
    <section class="card" aria-labelledby="login-title">
      <h2 id="login-title" class="card-title">Anmelden</h2>

      <form onsubmit="return false;" novalidate>
        <!-- Username -->
        <div class="form-group">
          <label for="username" class="label">Benutzername</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="input-field" 
              value="anna" 
              autocomplete="username" 
              required
            >
          </div>
        </div>

        <!-- Password (masked, error state) -->
        <div class="form-group">
          <label for="password" class="label">Passwort</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="input-field error" 
              value="••••••••••••" 
              autocomplete="current-password" 
              aria-invalid="true" 
              aria-describedby="password-error"
              required
            >
          </div>
          <div id="password-error" class="error-row" role="alert">
            <svg class="error-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ff5c5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>Benutzername oder Passwort falsch.</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit">
          Anmelden
        </button>
      </form>
    </section>

    <!-- Administrative Note -->
    <p class="footer-note">
      Konten werden von der Verwaltung angelegt.
    </p>
  </main>
</body>
</html>
