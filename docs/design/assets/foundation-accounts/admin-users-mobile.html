<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P1 Admin users – mobile</title>
  <style>
    :root {
      --bg: #0f1115;
      --foreground: #e8eaed;
      --primary: #ff7a1a;
      --surface: #1c2029;
      --accent: #4fb3ff;
      --muted: #9aa0aa;
      --border: #2a2f3a;
      --destructive: #ff5c5c;
      --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--foreground);
      font-family: var(--font);
      line-height: 1.5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .mobile-shell {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* Top Bar */
    .top-bar {
      height: 56px;
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--foreground);
    }

    .brand-logo {
      width: 24px;
      height: 24px;
      color: var(--primary);
    }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .account-avatar {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      background-color: var(--border);
      color: var(--foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Main Content */
    .content {
      flex: 1;
      padding: 16px 16px 88px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .page-header {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--foreground);
      line-height: 1.2;
    }

    .page-subtitle {
      font-size: 14px;
      color: var(--muted);
    }

    /* Cards */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-identity {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .username {
      font-size: 16px;
      font-weight: 600;
      color: var(--foreground);
    }

    .user-self-tag {
      font-size: 14px;
      color: var(--muted);
      font-weight: 400;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
    }

    .badge-admin {
      color: var(--primary);
      border: 1px solid var(--primary);
      background-color: rgba(255, 122, 26, 0.08);
    }

    .badge-benutzer {
      color: var(--muted);
      border: 1px solid var(--border);
      background-color: rgba(255, 255, 255, 0.02);
    }

    .card-meta {
      font-size: 13px;
      color: var(--muted);
    }

    /* Controls & Actions inside card */
    .card-actions-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .role-select-box {
      position: relative;
      width: 100%;
    }

    .select-input {
      width: 100%;
      height: 44px;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--foreground);
      font-family: inherit;
      font-size: 15px;
      padding: 0 36px 0 12px;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      cursor: pointer;
    }

    .select-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--muted);
      display: flex;
      align-items: center;
    }

    .buttons-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      height: 44px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
      touch-action: manipulation;
    }

    .btn-secondary {
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--foreground);
      flex: 1;
      white-space: nowrap;
    }

    .btn-secondary:hover {
      background-color: #242935;
      border-color: #3b4252;
    }

    .btn-danger {
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--destructive);
      padding: 0 16px;
      white-space: nowrap;
    }

    .btn-danger:hover {
      background-color: rgba(255, 92, 92, 0.08);
      border-color: rgba(255, 92, 92, 0.3);
    }

    .disabled-control {
      opacity: 0.4;
      pointer-events: none;
      cursor: not-allowed;
    }

    /* New User Form Card */
    .form-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 4px;
    }

    .form-card-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--foreground);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--foreground);
    }

    .form-input {
      width: 100%;
      height: 44px;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--foreground);
      font-family: inherit;
      font-size: 16px;
      padding: 0 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .form-hint {
      font-size: 12px;
      color: var(--muted);
    }

    .btn-primary {
      width: 100%;
      height: 44px;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      color: #0f1115;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.15s;
      margin-top: 4px;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
    }

    .btn-primary:active {
      filter: brightness(0.92);
    }

    /* Fixed Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 390px;
      height: 64px;
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 30;
      padding: 0 4px;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      text-decoration: none;
      flex: 1;
      height: 100%;
      min-width: 44px;
      cursor: pointer;
      transition: color 0.15s;
    }

    .nav-icon {
      width: 22px;
      height: 22px;
    }

    .nav-label {
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="mobile-shell">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <!-- Amber Play Triangle Logo -->
        <svg class="brand-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 4.5V19.5L19 12L7 4.5Z" fill="currentColor"/>
        </svg>
        <span class="brand-name">Videothek</span>
      </div>
      <div class="account-avatar" title="Konto: Admin" aria-label="Konto Admin">A</div>
    </header>

    <!-- Main Content -->
    <main class="content">
      <div class="page-header">
        <h1 class="page-title">Benutzerverwaltung</h1>
        <div class="page-subtitle">4 Konten</div>
      </div>

      <!-- User List -->
      <section class="card-list" aria-label="Benutzerliste">
        
        <!-- User 1: admin (du) -->
        <article class="user-card">
          <div class="user-card-header">
            <div class="user-identity">
              <span class="username">admin</span>
              <span class="user-self-tag">(du)</span>
            </div>
            <span class="badge badge-admin">Admin</span>
          </div>
          <div class="card-meta">Angelegt am 26.09.2026</div>
          <div class="card-actions-wrapper">
            <div class="role-select-box">
              <select class="select-input disabled-control" disabled aria-label="Rolle für admin">
                <option value="Admin" selected>Admin</option>
                <option value="Benutzer">Benutzer</option>
              </select>
              <div class="select-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 9l6 6 6-6"/>
                </svg>
              </div>
            </div>
            <div class="buttons-group">
              <button type="button" class="btn btn-secondary">Passwort zurücksetzen</button>
              <button type="button" class="btn btn-danger disabled-control" disabled aria-disabled="true">Löschen</button>
            </div>
          </div>
        </article>

        <!-- User 2: anna -->
        <article class="user-card">
          <div class="user-card-header">
            <div class="user-identity">
              <span class="username">anna</span>
            </div>
            <span class="badge badge-benutzer">Benutzer</span>
          </div>
          <div class="card-meta">Angelegt am 26.09.2026</div>
          <div class="card-actions-wrapper">
            <div class="role-select-box">
              <select class="select-input" aria-label="Rolle für anna">
                <option value="Benutzer" selected>Benutzer</option>
                <option value="Admin">Admin</option>
              </select>
              <div class="select-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 9l6 6 6-6"/>
                </svg>
              </div>
            </div>
            <div class="buttons-group">
              <button type="button" class="btn btn-secondary">Passwort zurücksetzen</button>
              <button type="button" class="btn btn-danger">Löschen</button>
            </div>
          </div>
        </article>

        <!-- User 3: ben -->
        <article class="user-card">
          <div class="user-card-header">
            <div class="user-identity">
              <span class="username">ben</span>
            </div>
            <span class="badge badge-benutzer">Benutzer</span>
          </div>
          <div class="card-meta">Angelegt am 26.09.2026</div>
          <div class="card-actions-wrapper">
            <div class="role-select-box">
              <select class="select-input" aria-label="Rolle für ben">
                <option value="Benutzer" selected>Benutzer</option>
                <option value="Admin">Admin</option>
              </select>
              <div class="select-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 9l6 6 6-6"/>
                </svg>
              </div>
            </div>
            <div class="buttons-group">
              <button type="button" class="btn btn-secondary">Passwort zurücksetzen</button>
              <button type="button" class="btn btn-danger">Löschen</button>
            </div>
          </div>
        </article>

        <!-- User 4: wohnzimmer-tv -->
        <article class="user-card">
          <div class="user-card-header">
            <div class="user-identity">
              <span class="username">wohnzimmer-tv</span>
            </div>
            <span class="badge badge-benutzer">Benutzer</span>
          </div>
          <div class="card-meta">Angelegt am 26.09.2026</div>
          <div class="card-actions-wrapper">
            <div class="role-select-box">
              <select class="select-input" aria-label="Rolle für wohnzimmer-tv">
                <option value="Benutzer" selected>Benutzer</option>
                <option value="Admin">Admin</option>
              </select>
              <div class="select-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 9l6 6 6-6"/>
                </svg>
              </div>
            </div>
            <div class="buttons-group">
              <button type="button" class="btn btn-secondary">Passwort zurücksetzen</button>
              <button type="button" class="btn btn-danger">Löschen</button>
            </div>
          </div>
        </article>

      </section>

      <!-- Neuer Benutzer Form -->
      <section class="form-card" aria-labelledby="form-new-user-title">
        <h2 id="form-new-user-title" class="form-card-title">Neuer Benutzer</h2>
        
        <div class="form-group">
          <label class="form-label" for="username-input">Benutzername</label>
          <input type="text" id="username-input" class="form-input" placeholder="z. B. julia" autocomplete="off" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password-input">Passwort</label>
          <input type="password" id="password-input" class="form-input" placeholder="••••••••" autocomplete="new-password" />
          <span class="form-hint">Mindestens 8 Zeichen</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="role-new-input">Rolle</label>
          <div class="role-select-box">
            <select id="role-new-input" class="select-input">
              <option value="Benutzer" selected>Benutzer</option>
              <option value="Admin">Admin</option>
            </select>
            <div class="select-arrow">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </div>
          </div>
        </div>

        <button type="button" class="btn-primary">Benutzer anlegen</button>
      </section>
    </main>

    <!-- Fixed Bottom Navigation Bar (all inactive / muted) -->
    <nav class="bottom-nav" aria-label="Hauptnavigation">
      <a href="#filme" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/>
          <line x1="7" y1="2" x2="7" y2="22"/>
          <line x1="17" y1="2" x2="17" y2="22"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <line x1="2" y1="7" x2="7" y2="7"/>
          <line x1="2" y1="17" x2="7" y2="17"/>
          <line x1="17" y1="17" x2="22" y2="17"/>
          <line x1="17" y1="7" x2="22" y2="7"/>
        </svg>
        <span class="nav-label">Filme</span>
      </a>

      <a href="#serien" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="15" rx="2" ry="2"/>
          <polyline points="17 2 12 7 7 2"/>
        </svg>
        <span class="nav-label">Serien</span>
      </a>

      <a href="#musik" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <span class="nav-label">Musik</span>
      </a>

      <a href="#hoerbuecher" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>

      <a href="#bilder" class="nav-item">

    </nav>
  </div>
</body>
