<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P4 Player Fortgesetzt – Desktop</title>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #e8eaed;
      --primary: #f5b301;
      --secondary: #1c2029;
      --muted: #9aa0aa;
      --border: #2a2f3a;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --radius-sm: 4px;
      --radius-md: 8px;
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 32px 40px;
      overflow-x: hidden;
    }

    .player-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top navigation header */
    .player-header {
      display: flex;
      align-items: center;
      gap: 20px;
      height: 48px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 16px;
      background-color: var(--secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--fg);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-back:hover {
      background-color: #242935;
      border-color: #3b4252;
    }

    .btn-back:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .title-meta-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
      overflow: hidden;
      white-space: nowrap;
    }

    .video-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.01em;
    }

    .video-meta {
      font-size: 14px;
      color: var(--muted);
      font-weight: 400;
    }

    /* Main Video Stage */
    .video-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: radial-gradient(circle at center, #14171d 0%, #0a0c0e 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* Center watermark play icon */
    .watermark-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.12;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .watermark-center svg {
      width: 88px;
      height: 88px;
      fill: var(--fg);
    }

    /* Resume Toast overlay */
    .toast-container {
      position: absolute;
      bottom: 84px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }

    .resume-toast {
      display: flex;
      align-items: center;
      gap: 16px;
      background-color: var(--secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 10px 16px 10px 18px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .toast-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast-icon {
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .toast-text {
      font-size: 16px;
      font-weight: 500;
      color: var(--fg);
      white-space: nowrap;
    }

    .btn-restart {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 16px;
      background-color: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--fg);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-restart:hover {
      background-color: rgba(255, 255, 255, 0.06);
      border-color: #3b4252;
    }

    .btn-restart:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .btn-close-toast {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .btn-close-toast:hover {
      color: var(--fg);
      background-color: rgba(255, 255, 255, 0.08);
    }

    .btn-close-toast:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* Video Control Strip */
    .control-strip-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      background: linear-gradient(to top, rgba(15, 17, 21, 0.95) 0%, rgba(15, 17, 21, 0.75) 60%, transparent 100%);
      padding: 24px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Scrubber bar */
    .scrubber-track {
      width: 100%;
      height: 6px;
      background-color: rgba(255, 255, 255, 0.18);
      border-radius: 9999px;
      position: relative;
      cursor: pointer;
      transition: height 0.15s ease;
    }

    .scrubber-track:hover {
      height: 8px;
    }

    .scrubber-played {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 24.08%; /* 12:34 out of 52:10 ~ 754s / 3130s ≈ 24.08% */
      background-color: var(--primary);
      border-radius: 9999px;
    }

    .scrubber-handle {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--primary);
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .scrubber-track:hover .scrubber-handle {
      opacity: 1;
    }

    /* Controls bar */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
    }

    .controls-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--fg);
      cursor: pointer;
      transition: color 0.15s ease, transform 0.1s ease;
    }

    .ctrl-btn:hover {
      color: var(--primary);
    }

    .ctrl-btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .time-display {
      font-size: 14px;
      font-weight: 500;
      color: var(--fg);
      font-variant-numeric: tabular-nums;
      user-select: none;
      letter-spacing: 0.02em;
    }

    .time-current {
      color: var(--fg);
    }

    .time-separator {
      color: var(--muted);
      margin: 0 4px;
    }

    .time-total {
      color: var(--muted);
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .volume-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .volume-slider {
      width: 68px;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      position: relative;
      cursor: pointer;
    }

    .volume-fill {
      width: 75%;
      height: 100%;
      background-color: var(--fg);
      border-radius: 9999px;
    }
  </style>
</head>
<body>

  <main class="player-container">
    <!-- Top row navigation & title -->
    <header class="player-header">
      <button class="btn-back" type="button" aria-label="Zurück zur Übersicht">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Zurück</span>
      </button>

      <div class="title-meta-group">
        <h1 class="video-title">Dark</h1>
        <span class="video-meta">Staffel 1 · Folge 3 · Geheimnisse</span>
      </div>
    </header>

    <!-- Main 16:9 Video Canvas Area -->
    <section class="video-stage" aria-label="Videoplayer">
      <!-- Muted Watermark Play Icon in Center -->
      <div class="watermark-center" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <polygon points="6 3 20 12 6 21 6 3"></polygon>
        </svg>
      </div>

      <!-- Resume Toast Overlay (Anchored bottom-center above controls) -->
      <div class="toast-container" role="status" aria-live="polite">
        <div class="resume-toast">
          <div class="toast-info">
            <span class="toast-icon" aria-hidden="true">
              <!-- Circular arrow / resume icon in amber -->
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6"></path>
                <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"></path>
              </svg>
            </span>
            <span class="toast-text">Fortgesetzt bei 12:34</span>
          </div>

          <button class="btn-restart" type="button">
            Von vorn
          </button>

          <button class="btn-close-toast" type="button" aria-label="Hinweis schließen" title="Hinweis schließen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Bottom Native-style Control Strip -->
      <div class="control-strip-wrapper">
        <!-- Scrubber Progress Bar (~24%) -->
        <div class="scrubber-track" role="progressbar" aria-valuenow="24" aria-valuemin="0" aria-valuemax="100" aria-label="Fortschrittsbalken">
          <div class="scrubber-played">
            <span class="scrubber-handle"></span>
          </div>
        </div>

        <div class="controls-row">
          <!-- Left Controls: Play/Pause, Time -->
          <div class="controls-left">
            <!-- Pause Icon (since playback resumed) -->
            <button class="ctrl-btn" type="button" aria-label="Pause">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="4" width="4" height="16" rx="1"></rect>
                <rect x="14" y="4" width="4" height="16" rx="1"></rect>
              </svg>
            </button>

            <div class="time-display">
              <span class="time-current">12:34</span>
              <span class="time-separator">/</span>
              <span class="time-total">52:10</span>
            </div>
          </div>

          <!-- Right Controls: Volume, Fullscreen -->
          <div class="controls-right">
            <div class="volume-group">
              <button class="ctrl-btn" type="button" aria-label="Stummschalten / Lautstärke">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
              </button>
              <div class="volume-slider" aria-hidden="true">
                <div class="volume-fill"></div>
              </div>
            </div>

            <button class="ctrl-btn" type="button" aria-label="Vollbildmodus">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
                <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
                <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
