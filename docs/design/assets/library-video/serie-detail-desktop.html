<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2 Serie Detail – Desktop v3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f1115;
      color: #e8eaed;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Top Bar */
    header {
      width: 100%;
      border-bottom: 1px solid #2a2f3a;
      background-color: #0f1115;
    }
    .top-bar {
      max-width: 1440px;
      margin: 0 auto;
      height: 64px;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 40px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      color: #e8eaed;
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      height: 64px;
    }
    .nav-link {
      color: #9aa0aa;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      height: 100%;
      position: relative;
      transition: color 0.15s ease;
    }
    .nav-link:hover {
      color: #e8eaed;
    }
    .nav-link.active {
      color: #ff7a1a;
      font-weight: 600;
    }
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background-color: #ff7a1a;
    }
    .btn-abmelden {
      background: transparent;
      border: none;
      color: #9aa0aa;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      transition: color 0.15s ease;
    }
    .btn-abmelden:hover {
      color: #e8eaed;
    }

    /* Content Layout */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #4fb3ff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .back-link:hover {
      text-decoration: underline;
    }

    /* Series Header */
    .series-header {
      display: flex;
      align-items: flex-end;
      gap: 24px;
      margin-bottom: 32px;
    }
    .poster-placeholder {
      width: 120px;
      height: 180px; /* 2:3 ratio */
      background-color: #1c2029;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }
    .poster-icon {
      position: absolute;
      top: 14px;
      left: 14px;
      color: #9aa0aa;
    }
    .poster-letter {
      font-size: 40px;
      font-weight: 700;
      color: #9aa0aa;
      line-height: 1;
    }
    .series-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 4px;
    }
    .series-title {
      font-size: 32px;
      font-weight: 700;
      color: #e8eaed;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .series-meta {
      font-size: 15px;
      color: #9aa0aa;
    }

    /* Season Chips */
    .season-chips {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }
    .chip {
      height: 44px;
      padding: 0 20px;
      border-radius: 9999px;
      background-color: #1c2029;
      border: 1px solid transparent;
      color: #e8eaed;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .chip:hover {
      background-color: #242935;
    }
    .chip.selected {
      color: #4fb3ff;
      border-color: #4fb3ff;
      background-color: rgba(79, 179, 255, 0.08);
      font-weight: 600;
    }

    /* Section Headings */
    .season-section {
      margin-bottom: 32px;
    }
    .season-header-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 14px;
    }
    .season-heading {
      font-size: 20px;
      font-weight: 600;
      color: #e8eaed;
    }
    .season-count {
      font-size: 14px;
      color: #9aa0aa;
    }

    /* Episode List */
    .episode-list {
      background-color: #1c2029;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      overflow: hidden;
    }
    .episode-row {
      min-height: 56px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a2f3a;
      transition: background-color 0.1s ease;
      cursor: pointer;
    }
    .episode-row:last-child {
      border-bottom: none;
    }
    .episode-row:hover {
      background-color: #222732;
    }
    
    /* Row with focused state */
    .episode-row.focused {
      outline: 2px solid #ff7a1a;
      outline-offset: 2px;
      border-radius: 4px;
      position: relative;
      z-index: 2;
    }

    .episode-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .episode-num {
      font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
      font-size: 15px;
      color: #9aa0aa;
      width: 24px;
      text-align: right;
      flex-shrink: 0;
    }
    .episode-title {
      font-size: 16px;
      font-weight: 500;
      color: #e8eaed;
    }

    .episode-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .episode-meta {
      font-size: 14px;
      color: #9aa0aa;
    }
    .play-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e8eaed;
    }

    /* Pill badge for unplayable file */
    .badge-unplayable {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      background-color: #0f1115;
      border: 1px solid #ff5c5c;
      color: #ff5c5c;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }
    .badge-unplayable svg {
      width: 14px;
      height: 14px;
      stroke: #ff5c5c;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <header>
    <div class="top-bar">
      <div class="top-bar-left">
        <a href="#" class="logo-container">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M5 3L19 12L5 21V3Z" fill="#ff7a1a"/>
          </svg>
          <span>Videothek</span>
        </a>
        <nav class="nav-links">
          <a href="#" class="nav-link">Filme</a>
          <a href="#" class="nav-link active">Serien</a>
          <a href="#" class="nav-link">Musik</a>
          <a href="#" class="nav-link">Hörbücher</a>
          <a href="#" class="nav-link">Bilder</a>
        </nav>
      </div>
      <div>
        <button class="btn-abmelden">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Abmelden</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Content column max 960 px -->
  <main>
    <!-- Back link -->
    <a href="#" class="back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      <span>Serien</span>
    </a>

    <!-- Header -->
    <div class="series-header">
      <div class="poster-placeholder">
        <div class="poster-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
            <polyline points="17 2 12 7 7 2"></polyline>
          </svg>
        </div>
        <div class="poster-letter">D</div>
      </div>
      <div class="series-info">
        <h1 class="series-title">Dark</h1>
        <div class="series-meta">2017 · 2 Staffeln · 7 Folgen</div>
      </div>
    </div>

    <!-- Season chips -->
    <div class="season-chips">
      <button class="chip selected">Staffel 1</button>
      <button class="chip">Staffel 2</button>
      <button class="chip">Specials</button>
      <button class="chip">Weitere Folgen</button>
    </div>

    <!-- Staffel 1 -->
    <section class="season-section">
      <div class="season-header-row">
        <h2 class="season-heading">Staffel 1</h2>
        <span class="season-count">4 Folgen</span>
      </div>
      <div class="episode-list">
        <!-- 01 Geheimnisse -->
        <div class="episode-row">
          <div class="episode-left">
            <span class="episode-num">01</span>
            <span class="episode-title">Geheimnisse</span>
          </div>
          <div class="episode-right">
            <span class="episode-meta">MP4 · 1,4 GB</span>
            <div class="play-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="6 3 20 12 6 21 6 3"></polygon>
              </svg>
            </div>
          </div>
        </div>

        <!-- 02 Lügen (Focused) -->
        <div class="episode-row focused">
          <div class="episode-left">
            <span class="episode-num">02</span>
            <span class="episode-title">Lügen</span>
          </div>
          <div class="episode-right">
            <span class="episode-meta">MP4 · 1,3 GB</span>
            <div class="play-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="6 3 20 12 6 21 6 3"></polygon>
              </svg>
            </div>
          </div>
        </div>

        <!-- 03 Folge 3 -->
        <div class="episode-row">
          <div class="episode-left">
            <span class="episode-num">03</span>
            <span class="episode-title">Folge 3</span>
          </div>
          <div class="episode-right">
            <span class="episode-meta">MP4 · 1,2 GB</span>
            <div class="play-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="6 3 20 12 6 21 6 3"></polygon>
              </svg>
            </div>
          </div>
        </div>

        <!-- 04 Doppelleben -->
        <div class="episode-row">
          <div class="episode-left">
            <span class="episode-num">04</span>
            <span class="episode-title">Doppelleben</span>
          </div>
          <div class="episode-right">
            <span class="episode-meta">MKV · 2,1 GB</span>
            <div class="badge-unplayable">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
              </svg>
              <span>Nicht abspielbar</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Staffel 2 -->
    <section class="season-section">
      <div class="season-header-row">
        <h2 class="season-heading">Staffel 2</h2>
        <span class="season-count">1 Folge</span>
      </div>
      <div class="episode-list">
        <!-- 01 Anfänge und Enden -->
        <div class="episode-row">
          <div class="episode-left">
            <span class="episode-num">01</span>
            <span class="episode-title">Anfänge und Enden</span>
          </div>
          <div class="episode-right">
            <span class="episode-meta">MP4 · 1,5 GB</span>
            <div class="play-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="6 3 20 12 6 21 6 3"></polygon>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
