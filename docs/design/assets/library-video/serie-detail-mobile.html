<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2 Serie Detail – Mobile v2</title>
  <style>
    /* CSS Tokens & Resets strictly per DESIGN.md & user constraints */
    :root {
      --bg: #0f1115;
      --surface: #1c2029;
      --text: #e8eaed;
      --muted: #9aa0aa;
      --border: #2a2f3a;
      --primary: #ff7a1a;
      --blue: #4fb3ff;
      --destructive: #ff5c5c;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
    }

    /* Centered 390px mobile viewport stage */
    .phone-container {
      width: 100%;
      max-width: 390px;
      min-height: 844px;
      background-color: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: 72px; /* Space for fixed bottom nav */
      overflow-x: hidden;
    }

    /* 1) Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 16px;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      color: var(--primary);
      display: flex;
      align-items: center;
    }

    .logout-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      border-radius: 8px;
      transition: color 0.15s ease;
    }

    .logout-btn:hover,
    .logout-btn:focus-visible {
      color: var(--text);
      outline: 2px solid var(--primary);
    }

    /* Main Content */
    .main-content {
      padding: 0 16px 24px 16px;
      display: flex;
      flex-direction: column;
    }

    /* 2) Back Link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      color: var(--blue);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      margin-top: 4px;
    }

    .back-link:hover,
    .back-link:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    /* 3) Series Header */
    .series-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
      margin-bottom: 20px;
    }

    .series-poster {
      width: 80px;
      height: 120px; /* 2:3 aspect ratio */
      flex-shrink: 0;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .poster-initial {
      font-size: 36px;
      font-weight: 700;
      color: var(--muted);
      line-height: 1;
      user-select: none;
    }

    .series-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      min-width: 0;
    }

    .series-title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .series-meta {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* 4) Horizontally Scrollable Season Chips */
    .chips-scroller {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-left: -16px;
      margin-right: -16px;
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 4px;
      margin-bottom: 24px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .chips-scroller::-webkit-scrollbar {
      display: none;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 18px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      background-color: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      transition: all 0.15s ease;
    }

    .chip.selected {
      color: var(--blue);
      border-color: var(--blue);
      background-color: rgba(79, 179, 255, 0.08);
    }

    .chip:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    /* 5 & 7) Section Headings */
    .section-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }

    .section-count {
      font-size: 14px;
      color: var(--muted);
    }

    .season-section {
      margin-bottom: 24px;
    }

    /* 6) Episode List */
    .episode-list {
      background-color: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .episode-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: background-color 0.15s ease;
    }

    .episode-row:last-child {
      border-bottom: none;
    }

    .episode-row:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .episode-num {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--muted);
      width: 24px;
      flex-shrink: 0;
      text-align: center;
    }

    .episode-details {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      gap: 2px;
    }

    .episode-name {
      font-size: 16px;
      color: var(--text);
      font-weight: 400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .episode-sub {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.3;
    }

    .episode-action {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 32px;
    }

    .play-icon-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }

    .episode-row:hover .play-icon-btn {
      color: var(--text);
    }

    /* "Nicht abspielbar" badge */
    .badge-unplayable {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--destructive);
      background-color: var(--bg);
      border: 1px solid var(--destructive);
      padding: 4px 8px;
      border-radius: 9999px;
      white-space: nowrap;
    }

    .badge-unplayable svg {
      flex-shrink: 0;
    }

    /* 8) Fixed Bottom Tab Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      height: 64px;
      background-color: var(--surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 30;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      gap: 3px;
      text-decoration: none;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      transition: color 0.15s ease;
      cursor: pointer;
    }

    .tab-item.active {
      color: var(--primary);
      font-weight: 600;
    }

    .tab-item:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: -2px;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <!-- 1) Slim top bar -->
    <header class="top-bar">
      <a href="#" class="brand-logo" aria-label="Videothek Startseite">
        <span class="brand-icon">
          <!-- Play icon mark -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6,4 20,12 6,20" />
          </svg>
        </span>
        <span>Videothek</span>
      </a>
      <button class="logout-btn" aria-label="Abmelden" title="Abmelden">
        <!-- Logout SVG line icon -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- 2) Back link -->
      <div>
        <a href="#" class="back-link" aria-label="Zurück zur Serienübersicht">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Serien
        </a>
      </div>

      <!-- 3) Series Header -->
      <section class="series-header" aria-labelledby="series-heading">
        <div class="series-poster" aria-hidden="true">
          <span class="poster-initial">D</span>
        </div>
        <div class="series-info">
          <h1 id="series-heading" class="series-title">Dark</h1>
          <p class="series-meta">2017 · 2 Staffeln · 7 Folgen</p>
        </div>
      </section>

      <!-- 4) Horizontally scrollable season chips -->
      <nav class="chips-scroller" aria-label="Staffelauswahl">
        <button class="chip selected" aria-pressed="true">Staffel 1</button>
        <button class="chip" aria-pressed="false">Staffel 2</button>
        <button class="chip" aria-pressed="false">Specials</button>
        <button class="chip" aria-pressed="false">Weitere Folgen</button>
      </nav>

      <!-- 5 & 6) Staffel 1 Section & Episodes -->
      <section class="season-section" aria-labelledby="heading-staffel-1">
        <div class="section-header">
          <h2 id="heading-staffel-1" class="section-title">Staffel 1</h2>
          <span class="section-count">4 Folgen</span>
        </div>

        <div class="episode-list" role="list">
          <!-- Row 01 -->
          <div class="episode-row" role="listitem">
            <span class="episode-num">01</span>
            <div class="episode-details">
              <span class="episode-name">Geheimnisse</span>
              <span class="episode-sub">MP4 · 1,4 GB</span>
            </div>
            <div class="episode-action">
              <span class="play-icon-btn" aria-label="Abspielen">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
              </span>
            </div>
          </div>

          <!-- Row 02 -->
          <div class="episode-row" role="listitem">
            <span class="episode-num">02</span>
            <div class="episode-details">
              <span class="episode-name">Lügen</span>
              <span class="episode-sub">MP4 · 1,3 GB</span>
            </div>
            <div class="episode-action">
              <span class="play-icon-btn" aria-label="Abspielen">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
              </span>
            </div>
          </div>

          <!-- Row 03 -->
          <div class="episode-row" role="listitem">
            <span class="episode-num">03</span>
            <div class="episode-details">
              <span class="episode-name">Folge 3</span>
              <span class="episode-sub">MP4 · 1,2 GB</span>
            </div>
            <div class="episode-action">
              <span class="play-icon-btn" aria-label="Abspielen">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
              </span>
            </div>
          </div>

          <!-- Row 04 (Not playable) -->
          <div class="episode-row" role="listitem">
            <span class="episode-num">04</span>
            <div class="episode-details">
              <span class="episode-name">Doppelleben</span>
              <span class="episode-sub">MKV · 2,1 GB</span>
            </div>
            <div class="episode-action">
              <span class="badge-unplayable">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                </svg>
                Nicht abspielbar
              </span>
            </div>
          </div>
        </div>
      </section>

      <!-- 7) Staffel 2 Section & Episodes -->
      <section class="season-section" aria-labelledby="heading-staffel-2">
        <div class="section-header">
          <h2 id="heading-staffel-2" class="section-title">Staffel 2</h2>
          <span class="section-count">1 Folge</span>
        </div>

        <div class="episode-list" role="list">
          <!-- Row 01 -->
          <div class="episode-row" role="listitem">
            <span class="episode-num">01</span>
            <div class="episode-details">
              <span class="episode-name">Anfänge und Enden</span>
              <span class="episode-sub">MP4 · 1,5 GB</span>
            </div>
            <div class="episode-action">
              <span class="play-icon-btn" aria-label="Abspielen">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
              </span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 8) Fixed Bottom Tab Bar -->
    <nav class="bottom-bar" aria-label="Hauptnavigation">
      <a href="#" class="tab-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
          <line x1="7" y1="2" x2="7" y2="22"></line>
          <line x1="17" y1="2" x2="17" y2="22"></line>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <line x1="2" y1="7" x2="7" y2="7"></line>
          <line x1="2" y1="17" x2="7" y2="17"></line>
          <line x1="17" y1="17" x2="22" y2="17"></line>
          <line x1="17" y1="7" x2="22" y2="7"></line>
        </svg>
        <span>Filme</span>
      </a>

      <a href="#" class="tab-item active" aria-current="page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
          <polyline points="17 2 12 7 7 2"></polyline>
        </svg>
        <span>Serien</span>
      </a>

      <a href="#" class="tab-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span>Musik</span>
      </a>

      <a href="#" class="tab-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
          <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
        </svg>
        <span>Hörbücher</span>
      </a>

      <a href="#" class="tab-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <span>Bilder</span>
      </a>
    </nav>
  </div>

</body>
</html>
