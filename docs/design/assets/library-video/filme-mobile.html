<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2 Filme – Mobile</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-bg: #0f1115;
      --color-surface: #1c2029;
      --color-foreground: #e8eaed;
      --color-muted: #9aa0aa;
      --color-border: #2a2f3a;
      --color-primary: #ff7a1a;
      --color-accent: #4fb3ff;
      --color-destructive: #ff5c5c;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-foreground);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background-attachment: fixed;
    }

    .device-wrapper {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background-color: var(--color-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 72px; /* Space for fixed bottom bar */
    }

    /* 1) Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 16px;
      background-color: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .wordmark-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      color: var(--color-primary);
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .wordmark {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-foreground);
      letter-spacing: -0.3px;
    }

    .logout-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--color-muted);
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .logout-btn:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    /* 2) Page Header & Sort */
    .page-header {
      padding: 16px 16px 12px 16px;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 16px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--color-foreground);
    }

    .item-count {
      font-size: 14px;
      color: var(--color-muted);
      font-weight: 400;
    }

    .sort-control {
      display: flex;
      width: 100%;
      height: 44px;
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      overflow: hidden;
    }

    .sort-option {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--color-muted);
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .sort-option:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: -2px;
      z-index: 2;
    }

    .sort-option.active {
      color: var(--color-accent);
      border: 1px solid var(--color-accent);
      border-radius: 7px;
      background-color: rgba(79, 179, 255, 0.08);
      margin: -1px;
    }

    /* 3) Grid */
    .grid-container {
      padding: 4px 16px 20px 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .media-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .media-card:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 4px;
      border-radius: 8px;
    }

    /* 2:3 Aspect ratio placeholder tile */
    .tile-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .tile-icon {
      position: absolute;
      top: 10px;
      left: 10px;
      color: var(--color-muted);
      width: 18px;
      height: 18px;
    }

    .tile-initials {
      font-size: 32px;
      font-weight: 700;
      color: var(--color-muted);
      letter-spacing: 0.5px;
      user-select: none;
    }

    /* Badge "Nicht abspielbar" */
    .badge-unplayable {
      position: absolute;
      top: 8px;
      right: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background-color: var(--color-bg);
      border: 1px solid var(--color-destructive);
      color: var(--color-destructive);
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 9999px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .badge-icon {
      width: 11px;
      height: 11px;
      stroke-width: 2.2;
    }

    /* Card Typography */
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-foreground);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .card-meta {
      font-size: 14px;
      color: var(--color-muted);
      line-height: 1.3;
    }

    /* 5) Fixed Bottom Navigation Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      height: 64px;
      background-color: var(--color-surface);
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: stretch;
      z-index: 30;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .nav-item {
      flex: 1;
      min-height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      text-decoration: none;
      background: none;
      border: none;
      color: var(--color-muted);
      cursor: pointer;
      padding: 6px 0;
      touch-action: manipulation;
    }

    .nav-item:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: -2px;
    }

    .nav-item.active {
      color: var(--color-primary);
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
    }

    .nav-label {
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="device-wrapper">
    <!-- 1) Slim top bar -->
    <header class="top-bar">
      <div class="wordmark-group">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <span class="wordmark">Videothek</span>
      </div>
      <button class="logout-btn" aria-label="Abmelden">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>

    </header>

    <!-- 2) Page Header & Sort -->
    <section class="page-header">
      <div class="title-row">
        <h1 class="page-title">Filme</h1>
        <span class="item-count">12 Titel</span>
      </div>
      <div class="sort-control" role="group" aria-label="Sortierung">
        <button class="sort-option active" aria-pressed="true">A–Z</button>
        <button class="sort-option" aria-pressed="false">Neu hinzugefügt</button>
      </div>
    </section>

    <!-- 3) Two-column grid of media cards -->
    <main class="grid-container" aria-label="Filmliste">
      
      <!-- Card 1: Arrival -->
      <article class="media-card" tabindex="0">
        <div class="tile-wrapper">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <line x1="2" y1="7" x2="7" y2="7"></line>
            <line x1="2" y1="17" x2="7" y2="17"></line>
            <line x1="17" y1="17" x2="22" y2="17"></line>
            <line x1="17" y1="7" x2="22" y2="7"></line>
          </svg>
          <span class="tile-initials">A</span>
        </div>
        <div class="card-title" title="Arrival">Arrival</div>
        <div class="card-meta">2016 · MP4</div>
      </article>

      <!-- Card 2: Blade Runner 2049 -->
      <article class="media-card" tabindex="0">
        <div class="tile-wrapper">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <line x1="2" y1="7" x2="7" y2="7"></line>
            <line x1="2" y1="17" x2="7" y2="17"></line>
            <line x1="17" y1="17" x2="22" y2="17"></line>
            <line x1="17" y1="7" x2="22" y2="7"></line>
          </svg>
          <span class="tile-initials">BR</span>
        </div>
        <div class="card-title" title="Blade Runner 2049">Blade Runner 2049</div>
        <div class="card-meta">2017 · MP4</div>
      </article>

      <!-- Card 3: Das Boot (Not playable) -->
      <article class="media-card" tabindex="0">
        <div class="tile-wrapper">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
            <line x1="7" y1="2" x2="7" y2="22"></line>
            <line x1="17" y1="2" x2="17" y2="22"></line>

        <div class="card-meta">1981 · MKV</div>
      </article>

      <!-- Card 4: Das Leben der Anderen -->

            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>

            <line x1="2" y1="12" x2="22" y2="12"></line>

            <line x1="17" y1="17" x2="22" y2="17"></line>

            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>

        <div class="card-meta">2010 · MP4</div>
      </article>

      <!-- Card 6: Interstellar -->
      <article class="media-card" tabindex="0">
        <div class="tile-wrapper">
          <svg class="tile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>

        <div class="card-title" title="Interstellar">Interstellar</div>
        <div class="card-meta">2014 · MP4</div>
      </article>

    </main>

    <!-- 5) Fixed bottom tab bar -->
    <nav class="bottom-bar" aria-label="Hauptnavigation">
      <button class="nav-item active" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
          <line x1="7" y1="2" x2="7" y2="22"></line>
          <line x1="17" y1="2" x2="17" y2="22"></line>

          <line x1="2" y1="7" x2="7" y2="7"></line>

        </svg>
        <span class="nav-label">Filme</span>

      <button class="nav-item">
