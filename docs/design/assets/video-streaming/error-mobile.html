<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Fehler – Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#0f1115',
            foreground: '#e8eaed',
            primary: '#ff7a1a',
            secondary: '#1c2029',
            accent: '#4fb3ff',
            muted: '#9aa0aa',
            border: '#2a2f3a',
            destructive: '#ff5c5c',
          },
          fontFamily: {
            sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0f1115;
      color: #e8eaed;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen bg-background text-foreground flex flex-col items-center">
  <!-- Mobile Container: 390px fixed simulation -->
  <div class="w-full max-w-[390px] min-h-screen flex flex-col px-4 py-4 box-border">
    
    <!-- 1. Top bar: Zurück button -->
    <header class="w-full flex items-center mb-6">
      <button type="button" class="inline-flex items-center gap-2 h-11 px-3.5 bg-secondary text-foreground rounded-lg border border-border text-sm font-medium hover:brightness-110 active:brightness-95 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
        <svg class="w-4 h-4 stroke-current" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Zurück</span>
      </button>
    </header>

    <!-- 2. Title block -->
    <div class="mb-6">
      <div class="text-xs uppercase tracking-wider font-semibold text-muted mb-1">Film</div>
      <h1 class="text-[20px] font-semibold text-foreground leading-tight">Das große Rennen</h1>
    </div>

    <!-- 3. Error Panel -->
    <main class="w-full bg-secondary rounded-2xl p-6 border border-border/40 flex flex-col items-center text-center shadow-lg">
      <!-- Crossed-out video/film icon in destructive red -->
      <div class="mb-4 text-destructive flex items-center justify-center" aria-hidden="true">
        <svg class="w-12 h-12 stroke-destructive" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <!-- Film / video reel with slash -->
          <rect x="2" y="2" width="20" height="20" rx="2.5"></rect>
          <path d="M7 2v20"></path>
          <path d="M17 2v20"></path>
          <path d="M2 12h20"></path>
          <path d="M2 7h5"></path>
          <path d="M2 17h5"></path>
          <path d="M17 17h5"></path>
          <path d="M17 7h5"></path>
          <line x1="2" y1="2" x2="22" y2="22" stroke-width="2"></line>
        </svg>
      </div>

      <!-- Pill badge "Nicht abspielbar" -->
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full border border-destructive bg-transparent text-destructive text-xs font-medium mb-4">
        <svg class="w-3.5 h-3.5 stroke-destructive" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
        <span>Nicht abspielbar</span>
      </div>

      <!-- Heading -->
      <h2 class="text-[20px] font-semibold text-foreground mb-3 leading-snug">
        Dieses Video kann nicht abgespielt werden
      </h2>

      <!-- Body text -->
      <p class="text-sm text-muted leading-relaxed mb-6">
        Das Format MKV kann der Browser nicht direkt wiedergeben. Die Datei bleibt unverändert in der Bibliothek.
      </p>

      <!-- Primary action button -->
      <button type="button" class="w-full h-11 bg-primary text-[#0f1115] font-semibold text-sm rounded-lg hover:brightness-105 active:brightness-95 transition-all flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-secondary">
        Zurück zur Übersicht
      </button>
    </main>

    <!-- Remainder is empty background -->
    <div class="flex-1"></div>
  </div>
</body>
</html>
