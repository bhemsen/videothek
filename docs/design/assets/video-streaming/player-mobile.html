<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player – Mobile</title>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #e8eaed;
      --primary: #ff7a1a;
      --secondary: #1c2029;
      --accent: #4fb3ff;
      --muted: #9aa0aa;
      --border: #2a2f3a;
      --destructive: #ff5c5c;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0;
      margin: 0;
    }

    .mobile-container {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      padding-bottom: 32px;
    }

    /* 1. Top Bar & Title Block with 16px side padding */
    .header-section {
      padding: 16px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 16px;
      background-color: var(--secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      align-self: flex-start;
      min-width: 44px;
    }

    .btn-back:active {
      filter: brightness(0.92);
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .overline {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.3;
    }

    .heading {
      font-size: 20px;
      font-weight: 600;
      color: var(--fg);
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    /* 2. Video Stage: edge-to-edge full width, 16:9 */
    .video-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: var(--bg);
      overflow: hidden;
    }

    .video-still {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Native mobile browser video controls emulation */
    .native-player-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: linear-gradient(to top, rgba(15, 17, 21, 0.9) 0%, rgba(15, 17, 21, 0.5) 70%, transparent 100%);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: var(--fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
    }

    .time-display {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--fg);
      white-space: nowrap;
    }

    .scrubber-track {
      flex: 1;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .scrubber-played {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 26.6%;
      background-color: var(--primary);
      border-radius: 2px;
    }

    .scrubber-thumb {
      position: absolute;
      left: 26.6%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--primary);
      transform: translateX(-50%);
    }

    /* 3. Post-stage action with 16px padding */
    .action-section {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-next {
      width: 100%;
      height: 48px;
      min-height: 44px;
      padding: 0 16px;
      background-color: var(--secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
    }

    .btn-next:active {
      filter: brightness(0.92);
    }

    svg {
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="mobile-container">
    <!-- Top Bar & Title Block -->
    <div class="header-section">
      <!-- Back Button -->
      <button class="btn-back" type="button" aria-label="Zurück">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Zurück</span>
      </button>

      <!-- Title Block -->
      <div class="title-block">
        <span class="overline">Die Nordküste</span>
        <h1 class="heading">S01E02 · Der Leuchtturm</h1>
      </div>
    </div>

    <!-- Video Stage (Full Width, 16:9) -->
    <div class="video-stage">
      <img src="https://lh3.googleusercontent.com/aida/AEtjO1WpZPKGq6QfNctFxnOjylI4prjv5ittMR4w6lj7kXq2jaencYkoMIfotKPpcjyFrPUTRn5pkjA4mmE9Q-O-XwTYEPHW_xAtCdPS7ENUDgx1i_vUiXiTnmsY7Ve_GIJixeN7MfEE1I1EMc45wlIf4qIe4-YdIrNUXX7-GWHK2EJSDwgJrpf4DjevfDdjASTgVyieY3BxSIznA9omYmLAjOacGf-IPfsbgNUXe3aDxPyr9U-Bu6T_bQ2bMIG2" alt="Die Nordküste - S01E02 Still" class="video-still">
      
      <!-- Native Mobile Player Controls Bar -->
      <div class="native-player-controls">
        <!-- Play / Pause Icon -->
        <button class="ctrl-btn" type="button" aria-label="Pause">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
          </svg>
        </button>

        <!-- Elapsed Time -->
        <span class="time-display">12:34</span>

        <!-- Scrubber Bar -->
        <div class="scrubber-track">
          <div class="scrubber-played"></div>
          <div class="scrubber-thumb"></div>
        </div>

        <!-- Total Time -->
        <span class="time-display">47:10</span>

        <!-- Fullscreen Icon -->
        <button class="ctrl-btn" type="button" aria-label="Vollbild">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Below the stage button -->
    <div class="action-section">
      <button class="btn-next" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 4 15 12 5 20 5 4" fill="currentColor"></polygon>
          <line x1="19" y1="5" x2="19" y2="19"></line>
        </svg>
        <span>Nächste Folge: S01E03 · Sturmflut</span>
      </button>
    </div>
  </div>
</body>
</html>
