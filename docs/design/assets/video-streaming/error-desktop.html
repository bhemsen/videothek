<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Fehler – Desktop</title>
  <style>
    /* Design Tokens */
    :root {
      --color-background: #0f1115;
      --color-foreground: #e8eaed;
      --color-primary: #ff7a1a;
      --color-secondary: #1c2029;
      --color-accent: #4fb3ff;
      --color-muted: #9aa0aa;
      --color-border: #2a2f3a;
      --color-destructive: #ff5c5c;

      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;

      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 16px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-background);
      color: var(--color-foreground);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 40px;
      -webkit-font-smoothing: antialiased;
    }

    .player-container {
      width: 100%;
      max-width: 1280px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 44px;
      padding: 0 16px;
      background-color: var(--color-secondary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-foreground);
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .btn-back:hover {
      background-color: #242934;
      border-color: #373e4d;
    }

    .btn-back:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .overline {
      font-size: 12px;
      font-weight: 500;
      color: var(--color-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .video-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--color-foreground);
      line-height: 1.2;
    }

    /* Stage Area */
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: var(--color-background);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    /* Error Panel */
    .error-panel {
      width: 100%;
      max-width: 480px;
      background-color: var(--color-secondary);
      border-radius: var(--radius-lg);
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .error-icon-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin-bottom: 16px;
    }

    .error-icon-wrapper svg {
      width: 48px;
      height: 48px;
      color: var(--color-destructive);
    }

    .badge-error {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-destructive);
      background-color: transparent;
      color: var(--color-destructive);
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: 0.02em;
    }

    .error-heading {
      font-size: 20px;
      font-weight: 600;
      color: var(--color-foreground);
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .error-body {
      font-size: 14px;
      line-height: 1.5;
      color: var(--color-muted);
      margin-bottom: 28px;
      max-width: 400px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 24px;
      background-color: var(--color-primary);
      color: #0f1115;
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: filter 0.15s ease, transform 0.1s ease;
      width: 100%;
      max-width: 280px;
    }

    .btn-primary:hover {
      filter: brightness(1.08);
    }

    .btn-primary:active {
      filter: brightness(0.92);
      transform: scale(0.99);
    }

    .btn-primary:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="player-container">
    <!-- Top Bar -->
    <header class="top-bar">
      <button class="btn-back" type="button" aria-label="Zurück">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        <span>Zurück</span>
      </button>

      <div class="title-group">
        <span class="overline">Film</span>
        <h1 class="video-title">Das große Rennen</h1>
      </div>
    </header>

    <!-- Stage / 16:9 Video Area -->
    <section class="stage" aria-label="Videoplayer">
      <div class="error-panel" role="alert">
        <!-- Crossed-out film/video SVG line icon -->
        <div class="error-icon-wrapper" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <!-- Slash line -->
            <line x1="2" y1="2" x2="22" y2="22"></line>
            <!-- Film reel / frame contours clipped by slash -->
            <path d="M19.8 15.5c.13-.48.2-.98.2-1.5V6a2 2 0 0 0-2-2H6.8"></path>
            <path d="M4.2 4.2A2 2 0 0 0 4 5v14a2 2 0 0 0 2 2h12.5c.34 0 .66-.08.95-.22"></path>
            <!-- Film perforations -->
            <line x1="4" y1="9" x2="7" y2="9"></line>
            <line x1="4" y1="15" x2="6.5" y2="15"></line>
            <line x1="17.5" y1="9" x2="20" y2="9"></line>
            <line x1="18.5" y1="15" x2="20" y2="15"></line>
            <line x1="4" y1="4" x2="4" y2="20"></line>
            <line x1="20" y1="4" x2="20" y2="20"></line>
          </svg>
        </div>

        <!-- Pill badge -->
        <div class="badge-error">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
          </svg>
          <span>Nicht abspielbar</span>
        </div>

        <!-- Heading -->
        <h2 class="error-heading">Dieses Video kann nicht abgespielt werden</h2>

        <!-- Explanatory body text -->
        <p class="error-body">
          Das Format MKV kann der Browser nicht direkt wiedergeben. Die Datei bleibt unverändert in der Bibliothek.
        </p>

        <!-- Primary Action -->
        <button class="btn-primary" type="button">
          Zurück zur Übersicht
        </button>
      </div>
    </section>
  </main>
</body>
</html>
